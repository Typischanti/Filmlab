# Veröffentlicht die Filmkamera auf GitHub Pages (unter …/camera/).
# Einmalig aktivieren: Repository → Settings → Pages → Source: „GitHub Actions“.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r camera _site/
          # Hauptadresse leitet zur Kamera weiter
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Filmkamera</title>
          <meta http-equiv="refresh" content="0; url=camera/">
          <link rel="canonical" href="camera/">
          <a href="camera/">Zur Filmkamera</a>
          HTML
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
